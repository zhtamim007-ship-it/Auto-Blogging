services:
  - type: web
    name: auto-blogging
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: NODE_ENV
        value: production
      # REQUIRED: paste your MongoDB Atlas connection string here after the
      # first deploy (sync: false means you supply the value in the dashboard).
      # If it is missing, /admin returns "Database unavailable" (see README).
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Must match an "Authorised redirect URI" on your Google OAuth client,
      # e.g. https://<your-service>.onrender.com/auth/callback
      # If omitted, the app auto-detects it (RENDER_EXTERNAL_URL → request host);
      # visit /auth/status to see the value actually being sent to Google.
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
